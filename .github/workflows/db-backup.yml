name: Nightly DB Backup

# Runs pg_dump against the production DB and uploads to S3 every night.
# Free on GitHub Actions for public repos and within the 2000 min/month
# allowance for private repos (each run takes <2 min).
#
# Required secrets (set in repo settings → Secrets → Actions):
#   DATABASE_URL          — full postgres connection string
#   S3_BUCKET_NAME        — bucket to upload to
#   AWS_ACCESS_KEY_ID     — IAM key with s3:PutObject on the bucket
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION            — e.g. ap-south-1
#
# Restore: download db-<timestamp>.sql.gz from S3, gunzip, psql -f.

on:
  schedule:
    # 03:00 IST = 21:30 UTC — quiet hour for India-based customers
    - cron: '30 21 * * *'
  workflow_dispatch: {}  # allow manual trigger from Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install pg_dump
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Run backup
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: node scripts/backup-db.js
